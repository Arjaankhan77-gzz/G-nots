<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — G-Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="brand-row">
  <svg class="hexmark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round"/>
    <path d="M12 2V22M3 7L21 17M21 7L3 17" stroke="#7C3AED" stroke-width="1.4"/>
  </svg>
  <span class="brand-name">G-Notes</span>
</div>

<div class="center-wrap">
  <div class="card">
    <p class="eyebrow">Almost done</p>
    <h1 class="heading">Set a new password</h1>

    <div id="banner"></div>

    <div id="formBlock" style="display:none;">
      <div class="field">
        <label for="newPass">New password</label>
        <div class="field-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="#9A93AC" stroke-width="1.3"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="#9A93AC" stroke-width="1.3"/></svg>
          <input id="newPass" class="has-toggle" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
          <button type="button" class="toggle-eye" data-target="newPass" aria-label="Show password">
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5Z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="confirmPass">Confirm new password</label>
        <div class="field-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="#9A93AC" stroke-width="1.3"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="#9A93AC" stroke-width="1.3"/></svg>
          <input id="confirmPass" class="has-toggle" type="password" required minlength="6" placeholder="Re-enter password" autocomplete="new-password">
          <button type="button" class="toggle-eye" data-target="confirmPass" aria-label="Show password">
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5Z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary" id="submitBtn">Update password</button>
    </div>

    <p class="divider-note"><a class="link" href="index.html">Back to sign in</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="common.js"></script>
<script>
const banner=document.getElementById('banner');
function showBanner(msg, kind){ banner.innerHTML = `<div class="banner banner-${kind}">${escapeHtml(msg)}</div>`; }
try{ wirePasswordToggles(); }catch(e){ console.error("password toggle setup failed:", e); }

const params = new URLSearchParams(window.location.search);
const oobCode = params.get('oobCode');

(async ()=>{
  if(!oobCode){
    showBanner('This link is missing its code — open the link from your email again.', 'error');
    return;
  }
  try{
    await auth.verifyPasswordResetCode(oobCode);
    document.getElementById('formBlock').style.display='block';
  }catch(err){
    showBanner('This reset link is invalid or has expired — request a new one from the sign-in page.', 'error');
  }
})();

document.getElementById('submitBtn').addEventListener('click', async ()=>{
  banner.innerHTML='';
  const p1 = document.getElementById('newPass').value;
  const p2 = document.getElementById('confirmPass').value;
  if(p1.length<6){ showBanner('Password needs to be at least 6 characters.', 'error'); return; }
  if(p1!==p2){ showBanner('Passwords do not match.', 'error'); return; }

  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='Updating...';
  try{
    await auth.confirmPasswordReset(oobCode, p1);
    document.getElementById('formBlock').style.display='none';
    showBanner('Password updated — you can sign in now.', 'success');
  }catch(err){
    showBanner('Could not update password: ' + err.message, 'error');
    btn.disabled=false; btn.textContent='Update password';
  }
});
</script>
</body>
</html>
