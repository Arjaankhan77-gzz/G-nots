<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — InsideBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="brand-row">
  <svg class="hexmark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="#3B6FE5" stroke-width="2" stroke-linejoin="round"/>
    <path d="M12 2V22M3 7L21 17M21 7L3 17" stroke="#3B6FE5" stroke-width="1.4"/>
  </svg>
  <span class="brand-name">InsideBox</span>
</div>

<div class="center-wrap">
  <div class="card">
    <div class="steps"><span id="s1" class="done"></span><span id="s2"></span><span id="s3"></span></div>
    <div id="banner"></div>

    <!-- Step 1: email + password -->
    <div id="step1">
      <p class="eyebrow">Step 1 of 3</p>
      <h1 class="heading">Create your account</h1>
      <div class="field">
        <label for="suEmail">Email address</label>
        <input id="suEmail" type="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="suPass">Password</label>
        <input id="suPass" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" id="step1Btn">Send verification code</button>
      <p class="divider-note">Already have an account? <a class="link" href="index.html">Sign in</a></p>
    </div>

    <!-- Step 2: OTP -->
    <div id="step2" style="display:none;">
      <p class="eyebrow">Step 2 of 3</p>
      <h1 class="heading">Check your email</h1>
      <p style="font-size:13.5px;color:var(--text-dim);margin-top:-14px;">
        We sent a 6-digit code to <strong id="otpEmailShown"></strong>.
      </p>
      <div class="field">
        <label for="otpInput">Verification code</label>
        <div class="otp-row"><input id="otpInput" type="text" inputmode="numeric" maxlength="6" placeholder="000000"></div>
      </div>
      <button class="btn btn-primary" id="step2Btn">Verify code</button>
      <div class="resend-row">
        Didn't get it? <button type="button" id="resendBtn">Resend code</button>
      </div>
    </div>

    <!-- Step 3: profile -->
    <div id="step3" style="display:none;">
      <p class="eyebrow">Step 3 of 3</p>
      <h1 class="heading">Finish setting up</h1>
      <div class="field">
        <label for="firstName">First name</label>
        <input id="firstName" type="text" required placeholder="First name">
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input id="lastName" type="text" required placeholder="Last name">
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" required placeholder="e.g. Axyz.22" autocomplete="off">
        <div class="username-status" id="usernameStatus"></div>
      </div>
      <div class="field">
        <label for="confirmPass">Confirm password</label>
        <input id="confirmPass" type="password" required placeholder="Re-enter your password" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" id="step3Btn">Create account</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="firebase-init.js"></script>
<script src="common.js"></script>
<script>
const banner=document.getElementById('banner');
function showBanner(msg, kind){ banner.innerHTML = `<div class="banner banner-${kind}">${escapeHtml(msg)}</div>`; }
function clearBanner(){ banner.innerHTML=''; }
function setStep(n){
  document.getElementById('step1').style.display = n===1 ? 'block':'none';
  document.getElementById('step2').style.display = n===2 ? 'block':'none';
  document.getElementById('step3').style.display = n===3 ? 'block':'none';
  document.getElementById('s1').classList.toggle('done', n>=1);
  document.getElementById('s2').classList.toggle('done', n>=2);
  document.getElementById('s3').classList.toggle('done', n>=3);
}

let pendingEmail='', pendingPass='';

/* ---- Step 1 ---- */
document.getElementById('step1Btn').addEventListener('click', async ()=>{
  clearBanner();
  const email = document.getElementById('suEmail').value.trim();
  const pass = document.getElementById('suPass').value;
  if(!email || pass.length<6){ showBanner('Enter a valid email and a password of at least 6 characters.', 'error'); return; }

  const btn=document.getElementById('step1Btn');
  btn.disabled=true; btn.textContent='Sending...';
  try{
    // Firebase itself will reject at final account-creation time if this email is
    // already registered — we surface that then, to avoid leaking account existence here.
    pendingEmail = email; pendingPass = pass;
    await requestOtp(email, 'signup');
    document.getElementById('otpEmailShown').textContent = email;
    setStep(2);
  }catch(err){
    showBanner('Could not send the code: ' + err.message, 'error');
  }finally{
    btn.disabled=false; btn.textContent='Send verification code';
  }
});

/* ---- Step 2 ---- */
document.getElementById('step2Btn').addEventListener('click', async ()=>{
  clearBanner();
  const code = document.getElementById('otpInput').value.trim();
  if(code.length!==6){ showBanner('Enter the 6-digit code.', 'error'); return; }
  const btn=document.getElementById('step2Btn');
  btn.disabled=true; btn.textContent='Verifying...';
  try{
    const result = await checkOtp(pendingEmail, 'signup', code);
    if(!result.ok){
      const msgs = {wrong:'That code is wrong.', expired:'That code expired — resend a new one.', too_many:'Too many wrong tries — resend a new code.', none:'Request a code first.'};
      showBanner(msgs[result.reason] || 'Could not verify that code.', 'error');
      return;
    }
    // Code confirmed they own this inbox — now create the real account.
    const cred = await auth.createUserWithEmailAndPassword(pendingEmail, pendingPass);
    setStep(3);
  }catch(err){
    if((err.code||'').includes('email-already-in-use')){
      showBanner('That email already has an account — try signing in instead.', 'error');
    } else {
      showBanner('Something went wrong: ' + err.message, 'error');
    }
  }finally{
    btn.disabled=false; btn.textContent='Verify code';
  }
});

document.getElementById('resendBtn').addEventListener('click', async ()=>{
  const btn=document.getElementById('resendBtn');
  btn.disabled=true;
  try{
    await requestOtp(pendingEmail, 'signup');
    showBanner('New code sent.', 'success');
  }catch(err){
    showBanner('Could not resend: ' + err.message, 'error');
  }
  setTimeout(()=>btn.disabled=false, 20000);
});

/* ---- Step 3: username availability (live check) ---- */
let usernameCheckTimer=null;
document.getElementById('username').addEventListener('input', (e)=>{
  const val = e.target.value.trim();
  const status = document.getElementById('usernameStatus');
  clearTimeout(usernameCheckTimer);
  if(!val){ status.textContent=''; return; }
  status.textContent='Checking...'; status.className='username-status checking';
  usernameCheckTimer = setTimeout(async ()=>{
    const free = await isUsernameAvailable(val);
    if(e.target.value.trim() !== val) return; // stale
    if(free){ status.textContent='Available'; status.className='username-status ok'; }
    else{ status.textContent='That name is already taken — try another.'; status.className='username-status taken'; }
  }, 400);
});

/* ---- Step 3: submit ---- */
document.getElementById('step3Btn').addEventListener('click', async ()=>{
  clearBanner();
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const username = document.getElementById('username').value.trim();
  const confirmPass = document.getElementById('confirmPass').value;

  if(!firstName || !lastName || !username){ showBanner('Fill in all fields.', 'error'); return; }
  if(confirmPass !== pendingPass){ showBanner('That password does not match what you entered in step 1.', 'error'); return; }

  const btn=document.getElementById('step3Btn');
  btn.disabled=true; btn.textContent='Creating...';
  try{
    const free = await isUsernameAvailable(username);
    if(!free){
      showBanner('That username is already taken — try another (e.g. add a number or change a letter).', 'error');
      btn.disabled=false; btn.textContent='Create account';
      return;
    }
    const uid = auth.currentUser.uid;
    await reserveUsername(username, uid, pendingEmail);
    await db.collection('users').doc(uid).set({
      firstName, lastName, username, email: pendingEmail,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    window.location.href = 'dashboard.html';
  }catch(err){
    if((err.code||'').includes('permission-denied')){
      showBanner('That username was just taken by someone else — try another.', 'error');
    } else {
      showBanner('Something went wrong: ' + err.message, 'error');
    }
    btn.disabled=false; btn.textContent='Create account';
  }
});
</script>
</body>
</html>
