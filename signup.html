<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — G-Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="brand-row">
  <svg class="hexmark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round"/>
    <path d="M12 2V22M3 7L21 17M21 7L3 17" stroke="#7C3AED" stroke-width="1.4"/>
  </svg>
  <span class="brand-name">G-Notes</span>
</div>

<div class="center-wrap">
  <div class="card">
    <div class="steps"><span id="s1" class="done"></span><span id="s2"></span></div>
    <div id="banner"></div>

    <!-- Step 1: email + password -->
    <div id="step1">
      <p class="eyebrow">Step 1 of 2</p>
      <h1 class="heading">Create your account</h1>
      <div class="field">
        <label for="suEmail">Email address</label>
        <input id="suEmail" type="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="suPass">Password</label>
        <div class="field-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="#9A93AC" stroke-width="1.3"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="#9A93AC" stroke-width="1.3"/></svg>
          <input id="suPass" class="has-toggle" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
          <button type="button" class="toggle-eye" data-target="suPass" aria-label="Show password">
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5Z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary" id="step1Btn">Continue</button>
      <p class="divider-note">Already have an account? <a class="link" href="index.html">Sign in</a></p>
    </div>

    <!-- Step 2: profile -->
    <div id="step2" style="display:none;">
      <p class="eyebrow">Step 2 of 2</p>
      <h1 class="heading">Finish setting up</h1>
      <div class="field">
        <label for="firstName">First name</label>
        <input id="firstName" type="text" required placeholder="First name">
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input id="lastName" type="text" required placeholder="Last name">
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" required placeholder="e.g. Axyz.22" autocomplete="off">
        <div class="username-status" id="usernameStatus"></div>
      </div>
      <div class="field">
        <label for="confirmPass">Confirm password</label>
        <div class="field-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="#9A93AC" stroke-width="1.3"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="#9A93AC" stroke-width="1.3"/></svg>
          <input id="confirmPass" class="has-toggle" type="password" required placeholder="Re-enter your password" autocomplete="new-password">
          <button type="button" class="toggle-eye" data-target="confirmPass" aria-label="Show password">
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5Z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary" id="step2Btn">Create account</button>
    </div>

    <!-- Success -->
    <div id="stepSuccess" style="display:none; text-align:center;">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--purple-light);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 13l5 5L19 7" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 class="heading" style="margin-bottom:8px;">You're all set!</h1>
      <p style="font-size:14px;color:var(--text-dim);margin:0 0 26px;">Your account has been created. You're ready to start using G-Notes.</p>
      <button class="btn btn-primary" id="goToDashboardBtn">OK</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="common.js"></script>
<script>
const banner=document.getElementById('banner');
function showBanner(msg, kind){ banner.innerHTML = `<div class="banner banner-${kind}">${escapeHtml(msg)}</div>`; }
function clearBanner(){ banner.innerHTML=''; }
function setStep(n){
  document.getElementById('step1').style.display = n===1 ? 'block':'none';
  document.getElementById('step2').style.display = n===2 ? 'block':'none';
  document.getElementById('s1').classList.toggle('done', n>=1);
  document.getElementById('s2').classList.toggle('done', n>=2);
}
try{ wirePasswordToggles(); }catch(e){ console.error("password toggle setup failed:", e); }

let pendingEmail='', pendingPass='';

/* ---- Step 1: create the account directly ---- */
document.getElementById('step1Btn').addEventListener('click', async ()=>{
  clearBanner();
  const email = document.getElementById('suEmail').value.trim();
  const pass = document.getElementById('suPass').value;
  if(!email || pass.length<6){ showBanner('Enter a valid email and a password of at least 6 characters.', 'error'); return; }

  const btn=document.getElementById('step1Btn');
  btn.disabled=true; btn.textContent='Creating...';
  try{
    await auth.createUserWithEmailAndPassword(email, pass);
    pendingEmail = email; pendingPass = pass;
    setStep(2);
  }catch(err){
    if((err.code||'').includes('email-already-in-use')){
      showBanner('That email already has an account — try signing in instead.', 'error');
    } else {
      showBanner('Something went wrong: ' + err.message, 'error');
    }
  }finally{
    btn.disabled=false; btn.textContent='Continue';
  }
});

/* ---- Step 2: username availability (live check) ---- */
let usernameCheckTimer=null;
document.getElementById('username').addEventListener('input', (e)=>{
  const val = e.target.value.trim();
  const status = document.getElementById('usernameStatus');
  clearTimeout(usernameCheckTimer);
  if(!val){ status.textContent=''; return; }
  status.textContent='Checking...'; status.className='username-status checking';
  usernameCheckTimer = setTimeout(async ()=>{
    const free = await isUsernameAvailable(val);
    if(e.target.value.trim() !== val) return; // stale
    if(free){ status.textContent='Available'; status.className='username-status ok'; }
    else{ status.textContent='That name is already taken — try another.'; status.className='username-status taken'; }
  }, 400);
});

/* ---- Step 2: submit ---- */
document.getElementById('step2Btn').addEventListener('click', async ()=>{
  clearBanner();
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const username = document.getElementById('username').value.trim();
  const confirmPass = document.getElementById('confirmPass').value;

  if(!firstName || !lastName || !username){ showBanner('Fill in all fields.', 'error'); return; }
  if(confirmPass !== pendingPass){ showBanner('That password does not match what you entered in step 1.', 'error'); return; }

  const btn=document.getElementById('step2Btn');
  btn.disabled=true; btn.textContent='Creating...';
  try{
    const free = await isUsernameAvailable(username);
    if(!free){
      showBanner('That username is already taken — try another (e.g. add a number or change a letter).', 'error');
      btn.disabled=false; btn.textContent='Create account';
      return;
    }
    const uid = auth.currentUser.uid;
    await reserveUsername(username, uid, pendingEmail);
    await db.collection('users').doc(uid).set({
      firstName, lastName, username, email: pendingEmail,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('step2').style.display='none';
    document.getElementById('stepSuccess').style.display='block';
  }catch(err){
    if((err.code||'').includes('permission-denied')){
      showBanner('That username was just taken by someone else — try another.', 'error');
    } else {
      showBanner('Something went wrong: ' + err.message, 'error');
    }
    btn.disabled=false; btn.textContent='Create account';
  }
});

document.getElementById('goToDashboardBtn').addEventListener('click', ()=>{
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
