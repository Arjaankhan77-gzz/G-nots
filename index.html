<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — G-Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="split-wrap">
  <div class="hero-panel">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="hero-brand">
      <svg class="hexmark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round"/>
        <path d="M12 2V22M3 7L21 17M21 7L3 17" stroke="#7C3AED" stroke-width="1.4"/>
      </svg>
      <span class="brand-name">G-Notes</span>
    </div>
    <h1 class="hero-headline">Connect. Share.<br>Chat. <span class="accent">Stay Private.</span></h1>
    <p class="hero-sub">G-Notes is your all-in-one platform to share notes and keep exactly what you want private, private.</p>
  </div>

  <div class="form-panel">
    <div class="card">
      <p class="eyebrow">Please enter your details</p>
      <h1 class="heading">Welcome back</h1>

      <div id="banner"></div>

      <form id="loginForm">
        <div class="field">
          <label for="loginId">Email or username</label>
          <div class="field-icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.2" r="2.7" stroke="#9A93AC" stroke-width="1.3"/><path d="M2.5 13.5c1-2.6 3.2-4 5.5-4s4.5 1.4 5.5 4" stroke="#9A93AC" stroke-width="1.3" stroke-linecap="round"/></svg>
            <input id="loginId" type="text" required placeholder="Email address or username" autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label for="loginPass">Password</label>
          <div class="field-icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="#9A93AC" stroke-width="1.3"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="#9A93AC" stroke-width="1.3"/></svg>
            <input id="loginPass" type="password" required placeholder="Password" autocomplete="current-password">
            <button type="button" class="toggle-eye" id="togglePass" aria-label="Show password">
              <svg id="eyeIcon" width="17" height="17" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5Z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/></svg>
            </button>
          </div>
        </div>

        <div class="row-between">
          <label class="remember"><input type="checkbox" id="rememberMe"> Remember for 30 days</label>
          <a class="link" href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Sign in</button>
      </form>

      <div class="or-divider">or</div>

      <button class="btn btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.95v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.05l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.95l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Sign in with Google
      </button>

      <p class="divider-note">Don't have an account? <a class="link" href="signup.html">Sign up</a></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
const banner=document.getElementById('banner');
function showBanner(msg, kind){
  banner.innerHTML = `<div class="banner banner-${kind}">${escapeHtml(msg)}</div>`;
}
function escapeHtml(str){return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}

document.getElementById('togglePass').addEventListener('click', ()=>{
  const input = document.getElementById('loginPass');
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
});

// If already signed in, skip straight to the dashboard.
auth.onAuthStateChanged(user=>{ if(user) window.location.href='dashboard.html'; });

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  banner.innerHTML='';
  const idValue = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value;
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true; submitBtn.textContent='Signing in...';

  try{
    let email = idValue;
    if(!idValue.includes('@')){
      const doc = await db.collection('usernames').doc(idValue).get();
      if(!doc.exists){
        showBanner('No account found with that username.', 'error');
        submitBtn.disabled=false; submitBtn.textContent='Sign in';
        return;
      }
      email = doc.data().email;
    }
    const persistence = document.getElementById('rememberMe').checked
      ? firebase.auth.Auth.Persistence.LOCAL
      : firebase.auth.Auth.Persistence.SESSION;
    await auth.setPersistence(persistence);
    await auth.signInWithEmailAndPassword(email, pass);
    window.location.href = 'dashboard.html';
  }catch(err){
    showBanner(friendlyError(err), 'error');
    submitBtn.disabled=false; submitBtn.textContent='Sign in';
  }
});

document.getElementById('googleBtn').addEventListener('click', async ()=>{
  banner.innerHTML='';
  const btn = document.getElementById('googleBtn');
  btn.disabled = true;
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await auth.signInWithPopup(provider);
    const userDoc = await db.collection('users').doc(result.user.uid).get();
    window.location.href = userDoc.exists ? 'dashboard.html' : 'complete-profile.html';
  }catch(err){
    showBanner(friendlyError(err), 'error');
    btn.disabled = false;
  }
});

function friendlyError(err){
  const c = err.code || '';
  if(c.includes('unauthorized-domain')) return "This website's address isn't approved for Google sign-in yet. In Firebase Console → Authentication → Settings → Authorized domains, add this site's domain, then try again.";
  if(c.includes('operation-not-allowed')) return 'Google sign-in isn\'t turned on yet. In Firebase Console → Authentication → Sign-in method, enable the Google provider.';
  if(c.includes('popup-blocked')) return 'Your browser blocked the sign-in popup — allow popups for this site and try again.';
  if(c.includes('popup-closed-by-user') || c.includes('cancelled-popup-request')) return 'The Google sign-in window was closed before finishing — try again.';
  if(c.includes('api-key') || c.includes('invalid-api-key')) return 'The site\'s Firebase keys aren\'t set up yet (still placeholders in firebase-init.js).';
  if(c.includes('wrong-password') || c.includes('invalid-credential')) return 'Wrong email/username or password.';
  if(c.includes('user-not-found')) return 'No account with that email — try signing up.';
  if(c.includes('too-many-requests')) return 'Too many attempts. Try again in a bit.';
  return 'Something went wrong: ' + (err.message || c);
}
</script>
</body>
</html>
