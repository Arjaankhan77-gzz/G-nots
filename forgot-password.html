<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — InsideBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="brand-row">
  <svg class="hexmark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="#3B6FE5" stroke-width="2" stroke-linejoin="round"/>
    <path d="M12 2V22M3 7L21 17M21 7L3 17" stroke="#3B6FE5" stroke-width="1.4"/>
  </svg>
  <span class="brand-name">InsideBox</span>
</div>

<div class="center-wrap">
  <div class="card">
    <p class="eyebrow">Forgot your password?</p>
    <h1 class="heading">Reset your password</h1>
    <p style="font-size:13.5px;color:var(--text-dim);margin-top:-14px;margin-bottom:20px;">
      Enter your account email and we'll send a link to set a new password.
    </p>

    <div id="banner"></div>

    <div id="requestBlock">
      <div class="field">
        <label for="resetEmail">Email address</label>
        <input id="resetEmail" type="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <button class="btn btn-primary" id="sendResetBtn">Send reset link</button>
    </div>

    <p class="divider-note"><a class="link" href="index.html">Back to sign in</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
function escapeHtml(str){return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
const banner=document.getElementById('banner');
function showBanner(msg, kind){ banner.innerHTML = `<div class="banner banner-${kind}">${escapeHtml(msg)}</div>`; }

document.getElementById('sendResetBtn').addEventListener('click', async ()=>{
  banner.innerHTML='';
  const email = document.getElementById('resetEmail').value.trim();
  if(!email){ showBanner('Enter your email first.', 'error'); return; }
  const btn=document.getElementById('sendResetBtn');
  btn.disabled=true; btn.textContent='Sending...';
  try{
    await auth.sendPasswordResetEmail(email, {
      url: window.location.origin + window.location.pathname.replace('forgot-password.html','index.html')
    });
    document.getElementById('requestBlock').style.display='none';
    showBanner("If that email has an account, a reset link is on its way. Check your inbox (and spam folder).", 'success');
  }catch(err){
    // Don't reveal whether the email exists — same message either way.
    document.getElementById('requestBlock').style.display='none';
    showBanner("If that email has an account, a reset link is on its way. Check your inbox (and spam folder).", 'success');
  }finally{
    btn.disabled=false; btn.textContent='Send reset link';
  }
});
</script>
</body>
</html>
